<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8eef6" media="(prefers-color-scheme: light)" />
    <title>Control Panel</title>
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css?v=20260915milk" />
  </head>
  <body>
    <header>
      <h1>Control Panel</h1>
      <p class="meta" id="statusLine"></p>
    </header>
    <main>
      <div id="deck" class="deck"></div>
    </main>
    <footer>
      <form
        id="loginForm"
        class="login-form"
        method="post"
        action="/signalk/v1/auth/login"
        autocomplete="on"
        hidden
      >
        <label>
          User
          <input
            id="loginUser"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
          />
        </label>
        <label>
          Password
          <input
            id="loginPass"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit">Log in</button>
        <span id="loginErr" class="error"></span>
      </form>
      <p id="loginWho" class="muted" hidden></p>
    </footer>
    <script src="app.js?v=20260915milk"></script>
  </body>
</html>
